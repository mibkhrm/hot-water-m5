name: Hot water check

on:
  schedule:
    # GitHub cron is UTC. 01:00-18:00 UTC = 6 am - 11 pm Pakistan time.
    - cron: "*/10 1-17 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hot-water
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check hot water
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOSTEL: M5
        run: python check_hot_water.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
